# CI/CD pipeline: build -> test -> security scan -> deploy.
#
# DevSecOps gates are placed BEFORE deploy, not after — a failed scan blocks
# the release rather than just reporting on it post-hoc ("shift left").

name: payments-api-ci-cd

on:
  push:
    branches: [main]
    paths:
      - "services/payments-api/**"
  pull_request:
    branches: [main]
    paths:
      - "services/payments-api/**"

env:
  IMAGE_NAME: payments-api
  ACR_LOGIN_SERVER: meshpaymentsprodacr.azurecr.io

jobs:
  # ---------------------------------------------------------------------
  # 1. Build & unit test
  # ---------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/payments-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: services/payments-api/test-results.xml

  # ---------------------------------------------------------------------
  # 2. Static analysis + dependency scanning (SAST + SCA)
  # ---------------------------------------------------------------------
  security-scan-code:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: services/payments-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # SAST: static analysis for insecure code patterns (e.g. eval usage,
      # hardcoded secrets, SQL injection sinks).
      - name: Run Bandit (SAST)
        run: |
          pip install bandit
          bandit -r app/ -f json -o bandit-report.json || true
          bandit -r app/ --severity-level medium  # fail the build on medium+

      # SCA: scan third-party dependencies for known CVEs before they ship.
      - name: Run pip-audit (SCA)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      # Secrets scanning: catch accidentally committed credentials.
      - name: Scan for committed secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: services/payments-api
          extra_args: --only-verified

  # ---------------------------------------------------------------------
  # 3. Build & scan container image
  # ---------------------------------------------------------------------
  build-and-scan-image:
    runs-on: ubuntu-latest
    needs: security-scan-code
    defaults:
      run:
        working-directory: services/payments-api
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      # Container image scanning: OS packages + app dependencies inside
      # the built image, not just source.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          severity: "CRITICAL,HIGH"
          exit-code: "1"   # fail the pipeline on critical/high findings

      - name: Log in to ACR
        if: github.ref == 'refs/heads/main'
        run: az acr login --name meshpaymentsprodacr

      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ---------------------------------------------------------------------
  # 4. Deploy (canary -> full rollout)
  # ---------------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-scan-image
    if: github.ref == 'refs/heads/main'
    environment: production  # requires manual approval gate in GitHub
    steps:
      - uses: actions/checkout@v4

      - name: Set AKS context
        uses: azure/aks-set-context@v3
        with:
          resource-group: mesh-payments-prod-rg
          cluster-name: mesh-payments-prod-aks

      - name: Canary rollout (10% traffic)
        run: |
          kubectl set image deployment/payments-api \
            payments-api=${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n mesh-payments --record
          kubectl rollout status deployment/payments-api -n mesh-payments --timeout=120s

      - name: Run smoke tests against canary
        run: curl -f https://payments-api.internal.mesh/health

      # A real pipeline would use Flagger/Argo Rollouts for automated
      # progressive traffic shifting + auto-rollback on error-rate spikes;
      # simplified here to a single rollout + health check gate.
